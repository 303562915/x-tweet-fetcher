name: Probe upstream reachability

# Temporary diagnostic: reports how X's syndication endpoint and the
# public proxies behave from a GitHub-hosted runner (fresh datacenter IP).
# Deleted once the numbers are recorded.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")

          def head(resp):
              keys = ("x-rate-limit-limit", "x-rate-limit-remaining", "x-rate-limit-reset",
                      "retry-after", "server", "cf-ray")
              return {k: resp.get(k) for k in keys if resp.get(k)}

          def probe(label, url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      print(f"[OK ] {label:<34} HTTP {r.status} len={len(body):<8} {head(r.headers)}")
                      return body
              except urllib.error.HTTPError as e:
                  e.read()
                  print(f"[ERR] {label:<34} HTTP {e.code} {head(e.headers)}")
              except Exception as e:
                  print(f"[ERR] {label:<34} {type(e).__name__}: {str(e)[:70]}")
              return None

          print("### 1. syndication (timeline source)")
          for user in ("nasa", "elonmusk"):
              probe(f"syndication/{user}",
                    f"https://syndication.twitter.com/srv/timeline-profile/screen-name/{user}")

          print("\n### 2. fxtwitter (single tweet)")
          body = probe("fxtwitter/jack/status/20", "https://api.fxtwitter.com/jack/status/20")
          if body:
              try:
                  d = json.loads(body)
                  print(f"     code={d.get('code')} author={d.get('tweet',{}).get('author',{}).get('screen_name')}")
              except Exception as e:
                  print("     parse:", e)

          print("\n### 3. public relays for syndication")
          target = "https://syndication.twitter.com/srv/timeline-profile/screen-name/nasa"
          enc = urllib.parse.quote(target, safe="")
          for label, url in (
              ("allorigins", f"https://api.allorigins.win/raw?url={enc}"),
              ("codetabs", f"https://api.codetabs.com/v1/proxy?quest={enc}"),
              ("r.jina.ai", f"https://r.jina.ai/{target}"),
          ):
              body = probe(label, url)
              if body:
                  print(f"     has __NEXT_DATA__: {b'__NEXT_DATA__' in body}")

          print("\n### 4. nitter instances")
          for host in ("nitter.tiekoetter.com", "twiiit.com", "nitter.net"):
              probe(f"nitter/{host}", f"https://{host}/nasa")
          PY
