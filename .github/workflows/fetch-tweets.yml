name: Fetch X timeline

# Scheduled X/Twitter timeline fetch — no login, no API key, no Nitter needed.
#
#   GitHub Actions -> x-tweet-fetcher (xcom backend) -> snapshots/<user>.json
#
# A logged-out profile page only embeds the first screen of tweets (measured:
# ~3-5), so this job accumulates: every run merges what it fetched into the
# existing snapshot, dedupes by tweet_id, sorts by absolute time and keeps the
# newest `limit`. Running hourly builds a rolling window of the last N posts.
#
# It also commits the result back, so each run is both a fetch and a snapshot.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      username:
        description: "X username without @"
        required: true
        default: "aleabitoreddit"
      limit:
        description: "How many recent posts the snapshot keeps"
        required: true
        default: "30"
      backend:
        description: "Backend to fetch with"
        required: false
        default: "xcom"

permissions:
  contents: write

concurrency:
  group: fetch-x-timeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install x-tweet-fetcher
        run: pip install -e .

      - name: Fetch and merge
        id: fetch
        timeout-minutes: 45
        env:
          # Manual runs use the inputs; scheduled runs fall back to the defaults.
          XTF_USERNAME: ${{ github.event.inputs.username || 'aleabitoreddit' }}
          XTF_LIMIT: ${{ github.event.inputs.limit || '30' }}
          # Pin the backend: falling back to syndication here would silently
          # replace a current timeline with year-old "featured" tweets.
          XTF_BACKEND: ${{ github.event.inputs.backend || 'xcom' }}
          # Both X endpoints report when their shared quota refills; sleep that
          # out rather than failing the run (max 25 min).
          XTF_WAIT_RATE_LIMIT: "1500"
        run: |
          set -o pipefail
          mkdir -p snapshots

          echo "fetching @${XTF_USERNAME} (limit ${XTF_LIMIT}, backend ${XTF_BACKEND})"
          if ! xtf --user "${XTF_USERNAME}" --limit "${XTF_LIMIT}" \
                 --backend "${XTF_BACKEND}" --pretty \
                 > "${RUNNER_TEMP}/fetched.json" 2> "${RUNNER_TEMP}/fetch.err"; then
            echo "::error::fetch failed for @${XTF_USERNAME}"
            cat "${RUNNER_TEMP}/fetch.err"
            exit 1
          fi
          cat "${RUNNER_TEMP}/fetch.err"

          python - <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          TWITTER_TIME = "%a %b %d %H:%M:%S %z %Y"
          user = os.environ["XTF_USERNAME"]
          limit = int(os.environ["XTF_LIMIT"])
          target = pathlib.Path("snapshots") / f"{user}.json"

          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return {}

          fresh = load(os.environ["RUNNER_TEMP"] + "/fetched.json")
          previous = load(target)

          merged = {}
          for tweet in (previous.get("tweets") or []) + (fresh.get("tweets") or []):
              tid = str(tweet.get("tweet_id") or "")
              if tid:
                  merged[tid] = tweet

          def stamp(tweet):
              try:
                  return datetime.strptime(tweet.get("created_at", ""), TWITTER_TIME).timestamp()
              except (ValueError, TypeError):
                  return 0.0

          tweets = sorted(merged.values(), key=stamp, reverse=True)[:limit]
          payload = {
              "username": user,
              "count": len(tweets),
              "backend": fresh.get("backend"),
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tweets": tweets,
          }
          text = json.dumps(payload, ensure_ascii=False, indent=2)
          target.write_text(text, encoding="utf-8")
          pathlib.Path("snapshots/latest.json").write_text(text, encoding="utf-8")
          print(f"fetched={fresh.get('count')} kept={len(tweets)} "
                f"known={len(merged)} backend={fresh.get('backend')}")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --staged --quiet; then
            echo "no change — no new posts since the last snapshot"
            exit 0
          fi
          git commit -m "chore(snapshots): fetch tweets $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
