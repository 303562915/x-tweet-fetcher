name: Fetch X timeline

# Scheduled X/Twitter timeline fetch — no login, no API key, no Nitter needed.
#
#   GitHub Actions -> x-tweet-fetcher (syndication backend) -> data/<user>.json
#
# Runs every 6 hours and can be triggered by hand from the Actions tab.
# The result is committed back to the repository, so each run adds a new
# snapshot that downstream tooling (or an agent) can read over raw HTTP.

on:
  schedule:
    - cron: "0 */6 * * *" # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch:
    inputs:
      username:
        description: "X username without @"
        required: true
        default: "elonmusk"
      limit:
        description: "Max tweets to keep (the widget page carries up to 100)"
        required: true
        default: "50"

permissions:
  contents: write

concurrency:
  group: fetch-x-timeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install x-tweet-fetcher
        run: pip install -e .

      - name: Fetch timeline
        id: fetch
        timeout-minutes: 45
        env:
          # Manual runs use the inputs; scheduled runs fall back to the defaults.
          XTF_USERNAME: ${{ github.event.inputs.username || 'elonmusk' }}
          XTF_LIMIT: ${{ github.event.inputs.limit || '50' }}
          # Set to 0 to force the Nitter path instead of the syndication endpoint.
          XTF_SYNDICATION: "1"
          # X caps syndication at 30 requests/window per IP, and GitHub's shared
          # runner pool routinely has none left. The endpoint reports when the
          # quota refills (x-rate-limit-reset), so sleep that out rather than
          # failing the run — up to 25 minutes.
          XTF_WAIT_RATE_LIMIT: "1500"
        run: |
          set -o pipefail
          mkdir -p snapshots

          echo "fetching @${XTF_USERNAME} (limit ${XTF_LIMIT})"
          if xtf --user "${XTF_USERNAME}" --limit "${XTF_LIMIT}" --pretty \
               > "snapshots/${XTF_USERNAME}.json" 2> "${RUNNER_TEMP}/fetch.err"; then
            cp "snapshots/${XTF_USERNAME}.json" snapshots/latest.json
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            # Keep the failure visible without silently committing an error body
            # as if it were a successful snapshot.
            rm -f "snapshots/${XTF_USERNAME}.json"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::fetch failed for @${XTF_USERNAME}"
            cat "${RUNNER_TEMP}/fetch.err"
          fi

          python - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("snapshots") / f"{os.environ['XTF_USERNAME']}.json"
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(f"tweets={payload.get('count')} backend={payload.get('backend')}")
          PY

      - name: Commit snapshot
        if: steps.fetch.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --staged --quiet; then
            echo "no change — timeline identical to the last snapshot"
            exit 0
          fi
          git commit -m "chore(snapshots): fetch tweets $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
